<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>解答之書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --p:0;                                  /* 專注程度 0–1，由按住按鈕驅動 */
  --w:min(42vw,250px);
  --h:calc(var(--w)*1.42);

  --bg:#d9d3dc; --bg-edge:#b9b0bd;
  --text:#3b3242; --muted:#6f6577;
  --line:rgba(122,96,58,.55);
  --glow:214,160,92;

  --cloth:#2b2238; --foil:#c9a464;
  --paper:#efe5cf; --paper-dk:#e3d6bb;
  --ink:#2b221c; --seal:#a3342b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#221c28; --bg-edge:#0c0a0f;
    --text:#e8dfd0; --muted:#8f8696;
    --line:rgba(201,164,100,.5);
    --glow:255,176,96;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:grid;place-items:center;overflow:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:radial-gradient(110% 85% at 50% 42%,var(--bg) 0%,var(--bg-edge) 100%);
  color:var(--text);
  font-family:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  -webkit-tap-highlight-color:transparent;
}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(26px,6vh,52px)}

/* ── 舞台與燈光 ───────────────────── */
.stage{position:relative;width:calc(var(--w)*2);height:var(--h);display:flex;justify-content:center}
.glow{
  position:absolute;left:50%;top:50%;width:calc(var(--w)*3.4);aspect-ratio:1;
  transform:translate(-50%,-50%) scale(calc(.75 + var(--p)*.45));
  opacity:calc(.3 + var(--p)*.7);pointer-events:none;
}
.glow::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--glow),.30) 0%,rgba(var(--glow),.08) 38%,transparent 64%);
  animation:breathe 6s ease-in-out infinite;
}
@keyframes breathe{50%{opacity:.6;transform:scale(.94)}}

.lift{filter:drop-shadow(0 calc(14px + var(--p)*12px) calc(26px + var(--p)*14px) rgba(0,0,0,.45))}

/* ── 書 ─────────────────────────── */
.book{
  position:relative;width:var(--w);height:var(--h);
  perspective:1700px;perspective-origin:0% 50%;
  transition:transform 1.1s cubic-bezier(.6,.05,.25,1);
}
.book.open{transform:translateX(calc(var(--w)/2))}

.paper{
  background:
    linear-gradient(to right,rgba(60,40,20,.20),rgba(60,40,20,0) 13%),
    linear-gradient(170deg,var(--paper),var(--paper-dk));
}
.base{
  position:absolute;inset:0;z-index:0;border-radius:1px 5px 5px 1px;
  box-shadow:1px 1px 0 #ddd0b4,2px 2px 0 #cfc1a3,3px 3px 0 #c3b493,4px 4px 0 #b3a382;
}

/* 翻飛的書頁 */
.leaf{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:opacity .25s;
}
.leaf.gone{opacity:0}
.leaf .f,.leaf .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:1px 5px 5px 1px;overflow:hidden}
.leaf .f::before,.leaf .b::before{                 /* 隱約的直排字行 */
  content:"";position:absolute;inset:16% 18%;
  background:repeating-linear-gradient(to left,rgba(43,34,28,.11) 0 2px,transparent 2px 15px);
  -webkit-mask:repeating-linear-gradient(transparent 0 6px,#000 6px 9px);
          mask:repeating-linear-gradient(transparent 0 6px,#000 6px 9px);
}
.leaf .f::after{content:"";position:absolute;inset:0;background:#000;opacity:0}
.leaf .b{
  transform:rotateY(180deg);border-radius:5px 1px 1px 5px;
  background:
    linear-gradient(to left,rgba(60,40,20,.20),rgba(60,40,20,0) 13%),
    linear-gradient(190deg,var(--paper),var(--paper-dk));
}
.leaf.flip{animation:flip .78s cubic-bezier(.45,.05,.3,1) forwards}
.leaf.flip .f::after{animation:shade .78s ease-in forwards}
@keyframes flip{to{transform:rotateY(-180deg)}}
@keyframes shade{50%{opacity:.28}100%{opacity:.28}}

/* 封面 */
.cover{
  position:absolute;inset:-5px -7px -5px 0;z-index:40;
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.2s cubic-bezier(.6,.05,.2,1);
}
.book.open .cover{transform:rotateY(-180deg)}
.book.spread .cover{z-index:5}
.cover .f,.cover .b{position:absolute;inset:0;backface-visibility:hidden}
.cover .f{
  border-radius:3px 8px 8px 3px;
  background:
    linear-gradient(to right,rgba(0,0,0,.45) 0,rgba(0,0,0,.1) 5%,rgba(255,255,255,.06) 6.5%,transparent 9%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px),
    radial-gradient(120% 90% at 35% 25%,#3b3050,var(--cloth) 60%,#1c1626);
}
.frame{
  position:absolute;inset:7% 8% 7% 13%;border:1px solid var(--foil);opacity:.8;
  box-shadow:inset 0 0 0 4px var(--cloth),inset 0 0 0 5px rgba(201,164,100,.55);
}
.title{
  position:absolute;left:52%;top:50%;transform:translate(-50%,-50%);
  writing-mode:vertical-rl;margin:0;font-weight:600;
  font-size:calc(var(--w)*.135);letter-spacing:.55em;padding-top:.55em;
  color:var(--foil);
  text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 calc(4px + var(--p)*22px) rgba(255,200,120,calc(var(--p)*.9));
}
.cover .b{
  transform:rotateY(180deg);border-radius:8px 3px 3px 8px;
  background:
    linear-gradient(to left,rgba(0,0,0,.4),transparent 12%),
    radial-gradient(circle,rgba(201,164,100,.16) 1px,transparent 1.6px) 0 0/11px 11px,
    #2e2640;
}

/* 答案頁內容 */
.answer{position:absolute;inset:13% 11% 18%;display:flex;align-items:center;justify-content:center}
.answer p{
  margin:0;writing-mode:vertical-rl;color:var(--ink);
  font-size:calc(var(--w)*.092);line-height:2.15;letter-spacing:.2em;
}
.ch{display:inline-block;opacity:0}
.base.reveal .ch{animation:ink 1.2s ease-out forwards;animation-delay:calc(var(--i)*95ms)}
@keyframes ink{
  from{opacity:0;filter:blur(5px);transform:translateY(-.25em)}
  to{opacity:1;filter:blur(0);transform:none}
}
.base.fade .answer,.base.fade .folio,.base.fade .seal{opacity:0!important;transition:opacity .25s}

.folio{
  position:absolute;bottom:6.5%;left:0;right:0;text-align:center;
  font-size:calc(var(--w)*.044);letter-spacing:.35em;color:#9a8a6f;
  opacity:0;transition:opacity 1s;
}
.base.reveal .folio{opacity:1}
.seal{
  position:absolute;left:11%;bottom:15%;width:calc(var(--w)*.135);aspect-ratio:1;
  display:grid;place-items:center;border-radius:3px;
  background:var(--seal);color:#f6e6d2;font-size:calc(var(--w)*.08);
  box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(246,230,210,.75);
  mix-blend-mode:multiply;opacity:0;transform:scale(1.9) rotate(-10deg);
}
.seal.on{animation:stamp .42s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{opacity:.92;transform:scale(1) rotate(-4deg)}}

/* ── 提示與按鈕 ───────────────────── */
.hint{margin:0;min-height:1.6em;font-size:14px;letter-spacing:.3em;color:var(--muted);transition:opacity .4s}
.hint.dim{opacity:0}
.btn{
  position:relative;overflow:hidden;border-radius:999px;cursor:pointer;
  padding:15px 34px 15px calc(34px + .4em);
  background:transparent;border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:15px;letter-spacing:.4em;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  transition:opacity .4s,border-color .3s;
}
.btn::before{
  content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p));
  background:linear-gradient(90deg,rgba(var(--glow),.38),rgba(var(--glow),.18));
}
.btn span{position:relative}
.btn:hover{border-color:rgba(var(--glow),.9)}
.btn:focus-visible{outline:2px solid rgba(var(--glow),.9);outline-offset:4px}
.btn:disabled{opacity:.3;cursor:default}

@media (prefers-reduced-motion:reduce){
  .leaf{display:none}
  .book,.cover{transition-duration:.35s}
  .glow::before{animation:none}
  .base.reveal .ch{animation:none;opacity:1}
  .seal.on{animation:none;opacity:.92;transform:rotate(-4deg)}
}
</style>
</head>
<body>
<main>
  <div class="stage">
    <div class="glow" aria-hidden="true"></div>
    <div class="lift">
      <div class="book" id="book">
        <div class="base paper" id="base">
          <div class="answer"><p id="answer" aria-live="polite"></p></div>
          <div class="seal" id="seal" aria-hidden="true">答</div>
          <div class="folio" id="folio" aria-hidden="true"></div>
        </div>
        <div id="leaves" aria-hidden="true"></div>
        <div class="cover" aria-hidden="true">
          <div class="f"><div class="frame"></div><h1 class="title">解答之書</h1></div>
          <div class="b"></div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">在心中默想一個問題</p>
  <button class="btn" id="btn" type="button"><span id="label">按住，翻開</span></button>
</main>

<script>
const ANSWERS = [
  "答案|就藏在你的猶豫裡。",
  "放手，|會比緊握得到更多。",
  "別再等了，|現在就去做。",
  "時機未到，|再耐心等一等。",
  "你心裡|早有定見。",
  "換個方向，|路會自己出現。",
  "值得|冒這個險。",
  "先問問自己，|真正想要的是什麼。",
  "別理會|旁人的聲音。",
  "順其自然，|一切自有安排。"
];

const HOLD = 1600;                       // 需要專注按住的時間（毫秒）
const LEAVES = 7;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = id => document.getElementById(id);
const root = document.documentElement;
const book = $("book"), base = $("base"), answerEl = $("answer");
const seal = $("seal"), folio = $("folio"), hint = $("hint");
const btn = $("btn"), label = $("label"), leavesBox = $("leaves");

const leaves = Array.from({length:LEAVES}, (_, i) => {
  const l = document.createElement("div");
  l.className = "leaf";
  l.innerHTML = '<div class="f paper"></div><div class="b"></div>';
  l.style.zIndex = 20 - i;
  leavesBox.appendChild(l);
  return l;
});

let state = "closed";                    // closed | busy | open
let p = 0, holding = false, raf = null, lastT = 0, last = -1, readyAt = 0;
const timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function setHint(text){
  hint.classList.add("dim");
  setTimeout(() => { hint.textContent = text; hint.classList.remove("dim"); }, 250);
}
function setP(v){ p = Math.min(1, Math.max(0, v)); root.style.setProperty("--p", p.toFixed(3)); }

function tick(t){
  const dt = t - lastT; lastT = t;
  setP(p + (holding ? dt / HOLD : -dt / (HOLD * .45)));
  if (holding && p >= 1){ raf = null; holding = false; complete(); return; }
  if (!holding && p <= 0){ raf = null; return; }
  raf = requestAnimationFrame(tick);
}
function run(){ if (!raf){ lastT = performance.now(); raf = requestAnimationFrame(tick); } }

function start(){
  if (state === "busy" || holding) return;
  if (state === "open") closeBook();
  holding = true;
  setHint("保持專注，默想你的問題");
  run();
}
function end(){
  if (!holding) return;
  holding = false;
  run();
  if (state === "closed") setHint("在心中默想一個問題");
}

/* 闔上書，為下一次提問做準備 */
function closeBook(){
  state = "closed";
  setP(0);
  base.classList.add("fade");
  leaves.forEach(l => l.classList.add("gone"));
  readyAt = performance.now() + (RM ? 400 : 1450);
  setTimeout(() => {
    leaves.forEach((l, i) => { l.classList.remove("flip"); l.style.zIndex = 20 - i; });
    book.classList.remove("spread", "open");
    base.classList.remove("reveal");
    seal.classList.remove("on");
  }, 250);
  setTimeout(() => {
    leaves.forEach(l => l.classList.remove("gone"));
    base.classList.remove("fade");
    answerEl.textContent = ""; folio.textContent = "";
  }, RM ? 400 : 1400);
}

/* 專注完成：翻開書，揭曉答案 */
function complete(){
  state = "busy";
  btn.disabled = true;
  setHint("");
  if (navigator.vibrate) navigator.vibrate(24);
  const wait = Math.max(0, readyAt - performance.now());
  setTimeout(() => { run(); reveal(); }, wait);
}

function reveal(){
  let i;
  do { i = Math.floor(Math.random() * ANSWERS.length); } while (i === last);
  last = i;

  let n = 0;
  answerEl.innerHTML = "";
  ANSWERS[i].split("|").forEach((seg, k) => {
    if (k) answerEl.appendChild(document.createElement("br"));
    for (const c of seg){
      const s = document.createElement("span");
      s.className = "ch"; s.textContent = c; s.style.setProperty("--i", n++);
      answerEl.appendChild(s);
    }
  });
  answerEl.setAttribute("aria-label", ANSWERS[i].replace("|", ""));
  folio.textContent = toZh(12 + Math.floor(Math.random() * 340));

  book.classList.add("open");
  const riffleAt = RM ? 0 : 640, gap = 135, dur = 780;
  later(() => book.classList.add("spread"), RM ? 200 : 560);
  if (!RM){
    leaves.forEach((l, k) => {
      later(() => l.classList.add("flip"), riffleAt + k * gap);
      later(() => { l.style.zIndex = 30 + k; }, riffleAt + k * gap + dur / 2);
    });
  }
  const revealAt = RM ? 400 : riffleAt + (LEAVES - 1) * gap + dur - 60;
  const inkTime = RM ? 0 : n * 95 + 900;
  later(() => base.classList.add("reveal"), revealAt);
  later(() => seal.classList.add("on"), revealAt + inkTime);
  later(() => {
    state = "open";
    btn.disabled = false;
    label.textContent = "按住，再問一次";
    setHint("收下這句話，讓它陪你一會兒");
    btn.focus({preventScroll:true});
  }, revealAt + inkTime + 500);
}

function toZh(num){
  const d = "零一二三四五六七八九";
  const h = Math.floor(num / 100), t = Math.floor(num % 100 / 10), u = num % 10;
  let s = "";
  if (h) s += d[h] + "百";
  if (t) s += (t === 1 && !h ? "" : d[t]) + "十";
  else if (h && u) s += "零";
  if (u) s += d[u];
  return s;
}

/* 按住：滑鼠、觸控、鍵盤皆可 */
btn.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  btn.setPointerCapture(e.pointerId);
  start();
});
["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, end));
btn.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && !e.repeat){ e.preventDefault(); start(); }
});
btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") end(); });
btn.addEventListener("blur", end);
btn.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
